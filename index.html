<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Motocross Mountain Offroad 3D - Para Alexandra #727</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #73a8c6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Pantalla de Inicio / Menú */
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1b4332, #2d6a4f);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 20px;
            box-sizing: border-box;
        }
        #menu-screen h1 {
            font-size: 32px;
            color: #f4d35e;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        #menu-screen .numero-badge {
            font-size: 55px;
            font-weight: bold;
            color: #ff477e;
            background: rgba(255,255,255,0.15);
            padding: 10px 30px;
            border-radius: 20px;
            margin: 15px 0;
            border: 3px solid #ff477e;
            box-shadow: 0 0 20px rgba(255, 71, 126, 0.4);
        }
        #menu-screen p.quote {
            font-size: 16px;
            color: #e9edc9;
            max-width: 500px;
            margin: 15px 0 25px 0;
            line-height: 1.5;
            font-style: italic;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.6);
        }
        #btn-play {
            background: #ff477e;
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 71, 126, 0.6);
            transition: transform 0.2s, background 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #btn-play:hover {
            transform: scale(1.05);
            background: #ff6b95;
        }

        /* Canvas para la lluvia de corazones del menú */
        #menu-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .menu-content {
            position: relative;
            z-index: 2;
        }

        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            background: rgba(40, 50, 40, 0.85);
            padding: 12px 20px;
            border-radius: 12px;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
            z-index: 10;
            border: 2px solid #8cb369;
            backdrop-filter: blur(8px);
            display: none;
        }
        h1.hud-title { font-size: 16px; margin: 0 0 4px 0; color: #f4d35e; text-transform: uppercase; letter-spacing: 1px; }
        .hud-sub { font-size: 11px; margin: 2px 0; color: #e9edc9; }
        #score-board {
            font-size: 20px;
            font-weight: bold;
            color: #ff477e;
            margin-top: 6px;
        }

        /* Mensaje Motivacional en Juego */
        #motivational-popup {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 71, 126, 0.95);
            color: white;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 0 25px rgba(255, 71, 126, 0.8);
            border: 2px solid #fff;
            z-index: 100;
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }
        #motivational-popup.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            background: rgba(40, 50, 40, 0.95);
            padding: 20px 40px;
            border-radius: 14px;
            border: 2px solid #f4d35e;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            z-index: 100;
            text-align: center;
            display: none;
        }
        #crash {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f94144;
            font-size: 32px;
            font-weight: bold;
            display: none;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            z-index: 100;
        }

        /* Controles Táctiles en Pantalla */
        .touch-controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            box-sizing: border-box;
            z-index: 50;
            pointer-events: none;
            display: none;
        }
        .control-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .btn-touch {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            outline: none;
        }
        .btn-touch:active, .btn-touch.active {
            background: rgba(244, 211, 94, 0.6);
            border-color: #f4d35e;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Interfaz de Inicio -->
    <div id="menu-screen">
        <canvas id="menu-canvas"></canvas>
        <div class="menu-content">
            <h1>Motocross Mountain</h1>
            <div class="numero-badge">#727</div>
            <p class="quote">"727 no lo lleva nadie, porque solo hay una campeona digna de ese número."</p>
            <button id="btn-play">¡A Correr, Alexandra!</button>
        </div>
    </div>

    <div id="loading">CARGANDO MUNDO...</div>
    <div id="crash">¡IMPACTO! (-10 PTS)</div>
    <div id="motivational-popup">¡Vas a arrasar en la nacional, Alexandra! 💖</div>

    <div id="hud">
        <h1 class="hud-title">Motocross Mountain #727</h1>
        <p class="hud-sub">Piloto: Alexandra</p>
        <div id="score-board">PUNTOS: <span id="score">0</span></div>
    </div>

    <!-- Botones Táctiles para Celular -->
    <div class="touch-controls" id="touch-ui">
        <div class="control-group">
            <button class="btn-touch" id="btn-left">◀</button>
            <button class="btn-touch" id="btn-right">▶</button>
        </div>
        <div class="control-group">
            <button class="btn-touch" id="btn-back">▼</button>
            <button class="btn-touch" id="btn-fwd">▲</button>
        </div>
    </div>

    <!-- Importar Three.js y GLTFLoader desde CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // Lluvia de corazones en el menú
        const menuCanvas = document.getElementById('menu-canvas');
        const mCtx = menuCanvas.getContext('2d');
        function resizeMenuCanvas() {
            menuCanvas.width = window.innerWidth;
            menuCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeMenuCanvas);
        resizeMenuCanvas();

        let menuHearts = [];
        for(let i=0; i<40; i++) {
            menuHearts.push({
                x: Math.random() * menuCanvas.width,
                y: Math.random() * menuCanvas.height - menuCanvas.height,
                size: Math.random() * 15 + 10,
                speed: Math.random() * 2 + 1,
                opacity: Math.random() * 0.7 + 0.3
            });
        }
        function drawMenuRain() {
            mCtx.clearRect(0, 0, menuCanvas.width, menuCanvas.height);
            mCtx.fillStyle = 'rgba(255, 71, 126, 0.6)';
            menuHearts.forEach(h => {
                mCtx.globalAlpha = h.opacity;
                mCtx.font = `${h.size}px Arial`;
                mCtx.fillText('❤️', h.x, h.y);
                h.y += h.speed;
                if(h.y > menuCanvas.height + 20) {
                    h.y = -20;
                    h.x = Math.random() * menuCanvas.width;
                }
            });
            requestAnimationFrame(drawMenuRain);
        }
        drawMenuRain();

        let gameStarted = false;
        let scene, camera, renderer, motoModel;
        let keys = { forward: false, backward: false, left: false, right: false };
        let speed = 0, maxSpeed = 0.65, turnSpeed = 0.045;
        let obstacles = [];
        let collectibles = [];
        let trackSegments = [];
        const segmentLength = 100; // Longitud de la carretera más corta por segmento
        const trackWidth = 24;     // Ancho normal de la pista
        let score = 0;
        let rockSceneTemplate = null;
        let treeSceneTemplate = null;
        let pajaSceneTemplate = null;
        let roadMaterial = null;
        let terrainMaterial = null;
        let pajaMaterial = null;
        let heartGeo = null;
        let heartMat = null;

        const motivationalMessages = [
            "¡Esa corona nacional ya es tuya, Alexandra! 👑",
            "¡Confía en tu talento y en tus manos, campeona! 💪",
            "¡El número 727 brilla con fuerza en la pista! ✨",
            "¡Los nervios son solo pasión, úsalos para ganar! 🔥",
            "¡Cada curva y cada salto los dominas a la perfección! 🏍️",
            "¡A dejar el alma en la pista, Alexandra! 💖",
            "¡Nadie maneja como tú, eres la mejor! ⭐"
        ];

        document.getElementById('btn-play').addEventListener('click', () => {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('touch-ui').style.display = 'flex';
            gameStarted = true;
            init();
            animate();
        });

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x73a8c6);
            scene.fog = new THREE.FogExp2(0x73a8c6, 0.005);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.BasicShadowMap;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
            sunLight.position.set(40, 80, 40);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 512;
            sunLight.shadow.mapSize.height = 512;
            scene.add(sunLight);

            roadMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xffffff, 
                roughness: 0.85, 
                metalness: 0.05 
            });

            terrainMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xffffff, 
                roughness: 0.9, 
                metalness: 0.0 
            });

            pajaMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xd4a373, 
                roughness: 0.8 
            });

            const x = 0, y = 0;
            const heartShape = new THREE.Shape();
            heartShape.moveTo( x + 5, y + 5 );
            heartShape.bezierCurveTo( x + 5, y + 5, x + 4, y, x, y );
            heartShape.bezierCurveTo( x - 6, y, x - 6, y + 7, x - 6, y + 7 );
            heartShape.bezierCurveTo( x - 6, y + 11, x - 3, y + 15.4, x + 5, y + 19 );
            heartShape.bezierCurveTo( x + 13, y + 15.4, x + 16, y + 11, x + 16, y + 7 );
            heartShape.bezierCurveTo( x + 16, y + 7, x + 16, y, x + 10, y );
            heartShape.bezierCurveTo( x + 7, y, x + 5, y + 5, x + 5, y + 5 );

            const extrudeSettings = { depth: 2, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 1, bevelThickness: 1 };
            heartGeo = new THREE.ExtrudeGeometry( heartShape, extrudeSettings );
            heartGeo.center();

            heartMat = new THREE.MeshStandardMaterial({ color: 0xff477e, roughness: 0.3, metalness: 0.2 });

            const textureLoader = new THREE.TextureLoader();

            textureLoader.load('./71560063-brown-ground-texture.jpg', (texture) => {
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                texture.repeat.set(1, 1); 
                roadMaterial.map = texture;
                roadMaterial.needsUpdate = true;
            });

            textureLoader.load('./campo-cesped-textura_1232-251.jpg', (texture) => {
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                texture.repeat.set(1, 1); 
                terrainMaterial.map = texture;
                terrainMaterial.needsUpdate = true;
            }, undefined, () => {
                terrainMaterial.color.set(0x355e3b);
            });

            const loader = new GLTFLoader();
            let assetsLoaded = 0;

            function checkAllLoaded() {
                assetsLoaded++;
                if (assetsLoaded >= 4) {
                    for (let i = -1; i < 8; i++) {
                        createTrackSegment(i * segmentLength);
                    }
                    const loadingDiv = document.getElementById('loading');
                    if (loadingDiv) loadingDiv.remove();
                }
            }

            loader.load('./arbol/scene.gltf', (gltf) => {
                treeSceneTemplate = gltf.scene;
                checkAllLoaded();
            }, undefined, () => { checkAllLoaded(); });

            loader.load('./roca/scene.gltf', (gltf) => {
                rockSceneTemplate = gltf.scene;
                checkAllLoaded();
            }, undefined, () => { checkAllLoaded(); });

            loader.load('./paja/scene.gltf', (gltf) => {
                pajaSceneTemplate = gltf.scene;
                pajaSceneTemplate.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if (child.material) {
                            child.material.side = THREE.DoubleSide;
                        }
                    }
                });
                checkAllLoaded();
            }, undefined, () => { checkAllLoaded(); });

            loader.load('./personaje/scene.gltf', (gltf) => {
                motoModel = gltf.scene;
                motoModel.scale.set(0.05, 0.05, 0.05); 
                motoModel.position.set(0, 1.7, 0); 

                motoModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                const canvasNum = document.createElement('canvas');
                canvasNum.width = 128;
                canvasNum.height = 128;
                const ctx = canvasNum.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 128, 128);
                ctx.strokeStyle = '#dc143c';
                ctx.lineWidth = 10;
                ctx.strokeRect(8, 8, 112, 112);
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 60px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('727', 64, 64);

                const textureNum = new THREE.CanvasTexture(canvasNum);
                const plateGeo = new THREE.PlaneGeometry(5, 5);
                const plateMat = new THREE.MeshBasicMaterial({ map: textureNum, side: THREE.DoubleSide });
                const numberPlate = new THREE.Mesh(plateGeo, plateMat);
                numberPlate.position.set(0, 12, -4);
                numberPlate.rotation.y = Math.PI; 
                motoModel.add(numberPlate);

                scene.add(motoModel);
                checkAllLoaded();

            }, undefined, (error) => {
                console.error('Error al cargar el personaje:', error);
            });

            setupTouchControls();
            window.addEventListener('keydown', (e) => handleKeys(e, true));
            window.addEventListener('keyup', (e) => handleKeys(e, false));
            window.addEventListener('resize', onWindowResize);
        }

        function setupTouchControls() {
            const bindButton = (id, keyName) => {
                const btn = document.getElementById(id);
                ['touchstart', 'mousedown'].forEach(evt => {
                    btn.addEventListener(evt, (e) => { e.preventDefault(); keys[keyName] = true; btn.classList.add('active'); });
                });
                ['touchend', 'mouseup', 'mouseleave'].forEach(evt => {
                    btn.addEventListener(evt, (e) => { e.preventDefault(); keys[keyName] = false; btn.classList.remove('active'); });
                });
            };

            bindButton('btn-left', 'left');
            bindButton('btn-right', 'right');
            bindButton('btn-fwd', 'forward');
            bindButton('btn-back', 'backward');
        }

        function createTrackSegment(xPosition) {
            const group = new THREE.Group();

            const roadGeo = new THREE.PlaneGeometry(segmentLength, trackWidth);
            const road = new THREE.Mesh(roadGeo, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.position.set(0, 0.01, 0);
            road.receiveShadow = true;
            group.add(road);

            const terrainGeo = new THREE.PlaneGeometry(segmentLength, 60);
            
            const terrainLeft = new THREE.Mesh(terrainGeo, terrainMaterial);
            terrainLeft.rotation.x = -Math.PI / 2;
            terrainLeft.position.set(0, 0, -trackWidth / 2 - 30);
            group.add(terrainLeft);

            const terrainRight = new THREE.Mesh(terrainGeo, terrainMaterial);
            terrainRight.rotation.x = -Math.PI / 2;
            terrainRight.position.set(0, 0, trackWidth / 2 + 30);
            group.add(terrainRight);

            // Fardos de paja colocados cada 12 pasos
            for (let x = -segmentLength / 2; x < segmentLength / 2; x += 12) {
                if (pajaSceneTemplate) {
                    const pajaLeft = pajaSceneTemplate.clone();
                    pajaLeft.scale.set(200.0, 200.0, 200.0);
                    pajaLeft.position.set(x, 0, -trackWidth / 2 - 1.5);
                    pajaLeft.rotation.y = Math.PI / 2;
                    group.add(pajaLeft);
                    obstacles.push({ mesh: pajaLeft, segmentGroup: group });

                    const pajaRight = pajaSceneTemplate.clone();
                    pajaRight.scale.set(200.0, 200.0, 200.0);
                    pajaRight.position.set(x, 0, trackWidth / 2 + 1.5);
                    pajaRight.rotation.y = Math.PI / 2;
                    group.add(pajaRight);
                    obstacles.push({ mesh: pajaRight, segmentGroup: group });
                }
            }

            for (let x = -segmentLength / 2; x < segmentLength / 2; x += 35) {
                if (treeSceneTemplate) {
                    const treeLeft = treeSceneTemplate.clone();
                    treeLeft.scale.set(2, 2, 2);
                    treeLeft.position.set(x, 0, -trackWidth / 2 - 8);
                    group.add(treeLeft);

                    const treeRight = treeSceneTemplate.clone();
                    treeRight.scale.set(2, 2, 2);
                    treeRight.position.set(x, 0, trackWidth / 2 + 8);
                    group.add(treeRight);
                }
            }

            for (let x = -segmentLength / 2 + 20; x < segmentLength / 2; x += 30) {
                if (rockSceneTemplate) {
                    const rock = rockSceneTemplate.clone();
                    rock.scale.set(1.2, 1.2, 1.2);
                    rock.position.set(x, 0, (Math.random() - 0.5) * (trackWidth - 6));
                    rock.rotation.y = Math.random() * Math.PI;
                    group.add(rock);
                    obstacles.push({ mesh: rock, segmentGroup: group });
                }

                const heart = new THREE.Mesh(heartGeo, heartMat);
                heart.scale.set(0.1, 0.1, 0.1);
                heart.rotation.x = Math.PI;
                heart.position.set(x + 10, 1.2, (Math.random() - 0.5) * (trackWidth - 6));
                group.add(heart);
                collectibles.push({ mesh: heart, segmentGroup: group });
            }

            group.position.x = xPosition;
            scene.add(group);
            trackSegments.push(group);
        }

        function handleKeys(e, isDown) {
            switch(e.code) {
                case 'KeyW':
                case 'ArrowUp': keys.forward = isDown; break;
                case 'KeyS':
                case 'ArrowDown': keys.backward = isDown; break;
                case 'KeyA':
                case 'ArrowLeft': keys.left = isDown; break;
                case 'KeyD':
                case 'ArrowRight': keys.right = isDown; break;
            }
        }

        let popupTimeout = null;
        function showMotivationalMessage() {
            const popup = document.getElementById('motivational-popup');
            const randomMsg = motivationalMessages[Math.floor(Math.random() * motivationalMessages.length)];
            popup.innerText = randomMsg;
            popup.classList.add('show');

            if (popupTimeout) clearTimeout(popupTimeout);
            popupTimeout = setTimeout(() => {
                popup.classList.remove('show');
            }, 2500);
        }

        function updateGameLogic() {
            if (!motoModel) return;
            const motoPos = motoModel.position;

            collectibles.forEach(item => { item.mesh.rotation.z += 0.04; });

            const collisionRadius = 2.0;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                const obsWorldPos = new THREE.Vector3();
                obs.mesh.getWorldPosition(obsWorldPos);

                const distance = Math.hypot(motoPos.x - obsWorldPos.x, motoPos.z - obsWorldPos.z);

                if (distance < collisionRadius) {
                    speed = -0.2; 
                    score = Math.max(0, score - 10);
                    document.getElementById('score').innerText = score;
                    
                    const crashDiv = document.getElementById('crash');
                    crashDiv.style.display = 'block';
                    setTimeout(() => { crashDiv.style.display = 'none'; }, 400);
                    break;
                }
            }

            for (let i = collectibles.length - 1; i >= 0; i--) {
                const item = collectibles[i];
                const coinWorldPos = new THREE.Vector3();
                item.mesh.getWorldPosition(coinWorldPos);

                const distanceCoin = Math.hypot(motoPos.x - coinWorldPos.x, motoPos.z - coinWorldPos.z);
                if (distanceCoin < 2.5) {
                    score += 50;
                    document.getElementById('score').innerText = score;
                    showMotivationalMessage();
                    item.segmentGroup.remove(item.mesh);
                    collectibles.splice(i, 1);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameStarted && motoModel) {
                if (keys.forward) {
                    speed = Math.min(speed + 0.015, maxSpeed);
                } else if (keys.backward) {
                    speed = Math.max(speed - 0.015, -maxSpeed / 2);
                } else {
                    speed *= 0.92; 
                }

                if (keys.left) motoModel.rotation.y += turnSpeed * (speed / maxSpeed);
                if (keys.right) motoModel.rotation.y -= turnSpeed * (speed / maxSpeed);

                motoModel.translateX(speed);
                updateGameLogic();

                const currentSegmentX = Math.floor(motoModel.position.x / segmentLength);
                if (currentSegmentX > trackSegments.length - 3) {
                    createTrackSegment(trackSegments.length * segmentLength);
                    if (trackSegments.length > 12) {
                        const oldSegment = trackSegments.shift();
                        scene.remove(oldSegment);
                        obstacles = obstacles.filter(o => o.segmentGroup !== oldSegment);
                        collectibles = collectibles.filter(c => c.segmentGroup !== oldSegment);
                    }
                }

                const offset = new THREE.Vector3(-6, 3, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), motoModel.rotation.y);
                const targetCameraPos = motoModel.position.clone().add(offset);
                camera.position.lerp(targetCameraPos, 0.15);
                camera.lookAt(motoModel.position.clone().add(new THREE.Vector3(0, 1.0, 0)));
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
